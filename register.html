<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Créer un compte — Urgence Lilloise</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:'Montserrat',sans-serif}
    body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 20% 20%, rgba(47,124,255,0.18), transparent 28%),radial-gradient(circle at 80% 25%, rgba(229,45,72,0.16), transparent 26%),linear-gradient(180deg,#05070d 0%,#060913 50%,#070b14 100%);color:#fff;padding:24px}
    .box{width:min(100%,460px);background:rgba(12,15,22,.88);border:1px solid rgba(255,255,255,.08);border-radius:18px;padding:28px;box-shadow:0 20px 60px rgba(0,0,0,.4)}
    h1{font-size:1.7rem;text-transform:uppercase;margin-bottom:8px}
    p{color:#a0a8b6;margin-bottom:18px;line-height:1.5}
    input,button{width:100%;padding:13px 14px;border-radius:12px;border:1px solid rgba(255,255,255,.1);outline:none;font-size:.95rem}
    input{background:#0a0a0c;color:#fff;margin:8px 0}
    button{background:#e52d48;color:#fff;border:none;font-weight:800;margin-top:8px;cursor:pointer;text-transform:uppercase;letter-spacing:1px}
    button:hover{background:#c02138}
    a{color:#7aa2ff;text-decoration:none}
    .row{margin-top:12px;color:#a0a8b6}
  </style>
</head>
<body>
  <div class="box">
    <h1>Créer un compte</h1>
    <p>Inscris-toi pour accéder à la boutique et passer commande.</p>
    <form id="form">
      <input name="nom" placeholder="Nom" required>
      <input name="prenom" placeholder="Prénom" required>
      <input name="discordId" placeholder="ID Discord" required>
      <input name="email" type="email" placeholder="Email" required>
      <input name="password" type="password" placeholder="Mot de passe" required>
      <button type="submit">Créer le compte</button>
    </form>
    <div class="row">Déjà un compte ? <a href="/login.html">Se connecter</a></div>
  </div>

  <script>
    document.getElementById('form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const data = Object.fromEntries(new FormData(e.target).entries());
      const r = await fetch('/api/register', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify(data)
      });
      const j = await r.json();
      if (j.success) location.href = '/shop.html';
      else alert(j.error || 'Erreur');
    });
  </script>
</body>
</html>
